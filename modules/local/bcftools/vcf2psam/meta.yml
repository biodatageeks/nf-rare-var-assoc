name: bcftools_vcf2frq
description: Extracts data from a VCF file to create a *.frq file in format expected by plink2 --read-freq
keywords:
  - query
  - variant calling
  - bcftools
  - VCF
tools:
  - vcf2frq:
      description: |
        Extracts fields from VCF or BCF files and outputs them in user-defined format.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: |
          The vcf file to be queried.
        pattern: "*.{vcf.gz, vcf}"
    - tbi:
        type: file
        description: |
          The tab index for the VCF file to be inspected.
        pattern: "*.tbi"
output:
  - output:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.frq":
          type: file
          description: vcf2frq output file
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@psuszyns"
maintainers:
  - "@psuszyns"
